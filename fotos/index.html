<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="4FINGERSFILME – Videograf und Editor aus Berlin. Dokumentarfilm, Imagefilm, Eventfilm und Social-Media-Content.">
  <title>4FINGERSFILME – Videograf & Editor Berlin</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f3f3f3;
      --text: #171717;
      --muted: #666666;
      --accent: #111111;
      --line: #e8e8e8;
      --page-width: 1440px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 28px; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    a { color: inherit; }

    /* Zurückhaltende, horizontale Kopfzeile mit klarer Trennung zum Inhalt. */
    .site-header {
      width: 100%;
      margin: 0 auto;
      padding: 15px clamp(24px, 5vw, 72px);
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
      background: #fff;
      border-bottom: 1px solid #ededed;
    }
    .brand-lockup {
      display: inline-flex;
      align-items: center;
      justify-content: flex-start;
      flex: 0 0 auto;
      color: #111;
      text-decoration: none;
    }
    .brand-logo {
      display: block;
      height: 2.42rem;
      width: auto;
      max-width: 100%;
      object-fit: contain;
    }
    .main-nav {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: clamp(22px, 3vw, 40px);
    }
    .main-nav a {
      position: relative;
      padding: 8px 0;
      text-decoration: none;
      color: #555;
      font-size: .72rem;
      line-height: 1.4;
      font-weight: 600;
      letter-spacing: .10em;
      transition: color .2s ease;
    }
    .main-nav a::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 1px;
      height: 1px;
      background: #111;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform .2s ease;
    }
    .main-nav a:hover, .main-nav a:focus-visible { color: #111; }
    .main-nav a:hover::after, .main-nav a:focus-visible::after { transform: scaleX(1); }

    /* Das Showreel steht direkt unter dem Kopfbereich. */
    .showreel-section {
      display: block;
      width: 100%;
      max-width: 100vw;
      margin: 0;
      padding: 32px 0 0;
      overflow: hidden;
      background: #fff;
      line-height: 0;
    }
    .showreel-frame {
      position: relative;
      width: 72%;
      height: auto;
      min-height: 0;
      margin: 0 auto;
      aspect-ratio: 16 / 9;
      overflow: hidden;
    }
    .showreel-frame iframe {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      max-width: 100%;
      border: 0;
    }

    .work-jump {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: fit-content;
      margin: 35px auto 68px;
      color: #777;
      text-decoration: none;
      font-size: .78rem;
      font-weight: 600;
      letter-spacing: .28em;
      transition: color .2s ease;
    }
    .work-jump:hover { color: #111; }
    .arrow {
      width: 15px;
      height: 15px;
      border-right: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor;
      transform: rotate(45deg);
      animation: bounce 2s infinite;
    }
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0) rotate(45deg); }
      40% { transform: translateY(-7px) rotate(45deg); }
      60% { transform: translateY(-3px) rotate(45deg); }
    }

    .content-section {
      width: min(100% - 48px, var(--page-width));
      margin: 0 auto;
      padding: 0 0 110px;
    }
    .section-heading {
      margin: 0 0 38px;
      font-size: clamp(1.6rem, 3vw, 2.2rem);
      font-weight: 400;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .video-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 42px 22px;
    }
    .video-card { min-width: 0; }
    .video-frame {
      width: 100%;
      aspect-ratio: 16 / 9;
      position: relative;
      overflow: hidden;
      background: #000;
      border-radius: 5px;
    }
    .video-frame iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .video-description h3 {
      margin: 13px 0 4px;
      color: var(--text);
      font-size: .98rem;
      font-weight: 550;
      letter-spacing: .02em;
    }
    .video-description p {
      margin: 0;
      color: var(--muted);
      font-size: .85rem;
      line-height: 1.6;
    }


    .about-section {
      display: grid;
      grid-template-columns: minmax(0, 1.18fr) minmax(260px, .82fr);
      gap: clamp(36px, 6vw, 90px);
      align-items: center;
      padding-bottom: 120px;
    }
    .about-section .section-heading { margin-bottom: 24px; }
    .about-image { min-width: 0; }
    .profile-img {
      display: block;
      width: 100%;
      max-width: 460px;
      height: auto;
      margin-left: auto;
      object-fit: cover;
    }
    .about-text p {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: .94rem;
      line-height: 1.85;
    }
    .about-text b { color: var(--text); font-weight: 600; }

    .contact-section {
      padding: 54px 24px 70px;
      text-align: center;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }
    .contact-section .section-heading { margin-bottom: 12px; }
    .contact-link {
      display: inline-block;
      color: #171717;
      font-size: clamp(1.1rem, 2.5vw, 1.6rem);
      letter-spacing: .04em;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color .2s ease;
    }
    .contact-link:hover { border-color: currentColor; }
    .footer {
      width: min(100% - 48px, var(--page-width));
      margin: 0 auto;
      padding: 24px 0 36px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      color: var(--muted);
      font-size: .8rem;
    }
    .footer a { text-decoration: none; }
    .footer a:hover { color: #111; }

    @media (max-width: 900px) {
      .video-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 600px) {
      .showreel-section { padding-top: 20px; }
      .showreel-frame { min-height: 0; }
      .site-header {
        width: 100%;
        min-height: 0;
        padding: 14px 16px 12px;
        flex-direction: column;
        gap: 9px;
      }
      .brand-logo {
        height: 1.28rem;
      }
      .main-nav { width: 100%; justify-content: center; gap: clamp(16px, 5vw, 25px); }
      .main-nav a { font-size: .62rem; letter-spacing: .10em; }
      .content-section { width: calc(100% - 32px); padding-bottom: 80px; }
      .video-grid { grid-template-columns: 1fr; gap: 34px; }
      .about-section {
        grid-template-columns: 1fr;
        gap: 22px;
        padding-bottom: 80px;
      }
      .about-image { grid-row: 2; }
      .profile-img { max-width: 100%; margin: 0; }
      .footer { width: calc(100% - 32px); }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .arrow { animation: none; }
      * { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body id="top">
  <main>
    <!-- Kompakte Kopfzeile mit Logo links und Navigation rechts. -->
    <header class="site-header">
      <a class="brand-lockup" href="#top" aria-label="4FingersFilme – Startseite">
        <img class="brand-logo" src="4fingerslogo.jpg" alt="4FingersFilme">
      </a>
      <nav class="main-nav" aria-label="Hauptnavigation">
        <a href="#work">Work</a>
        <a href="https://www.4fingersfilme.de/fotos">Foto</a>
        <a href="#ueber">Über</a>
        <a href="#kontakt">Kontakt</a>
      </nav>
    </header>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fotos | 4Fingers Filme</title>

<style>
:root {
    --bg-color: #00000;
    --text-color: #ffffff;
    --accent-color: #99f3ff;
    --muted-text: #8e94a5;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: var(--bg-color);
    color: var(--text-color);
    font-family: Arial, sans-serif;
    min-height: 100vh;
    padding: 45px 6%;
}

header {
    text-align: center;
    margin-bottom: 45px;
}

header h1 {
    font-size: 28px;
    font-weight: 400;
    letter-spacing: 5px;
    text-transform: uppercase;
}

header h1 span {
    color: var(--accent-color);
}

.gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    max-width: 1400px;
    margin: auto;
}

.gallery img {
    width: 100%;
    aspect-ratio: 4 / 5;
    object-fit: cover;
    display: block;
    cursor: pointer;
    transition: transform 0.3s ease, opacity 0.3s ease;
}

.gallery img:hover {
    transform: scale(1.02);
    opacity: 0.9;
}

/* Großansicht */

.lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(20, 20, 25, 0.94);
    justify-content: center;
    align-items: center;
    z-index: 100;
    padding: 30px;
}

.lightbox img {
    max-width: 90%;
    max-height: 90vh;
    object-fit: contain;
}

.lightbox.active {
    display: flex;
}

.close {
    position: absolute;
    top: 20px;
    right: 30px;
    font-size: 40px;
    color: var(--accent-color);
    cursor: pointer;
}

/* Kontakt */

footer {
    text-align: center;
    margin-top: 55px;
    padding-bottom: 20px;
    color: var(--muted-text);
    font-size: 14px;
}

footer a {
    color: var(--accent-color);
    text-decoration: none;
}

footer a:hover {
    text-decoration: underline;
}

@media (max-width: 800px) {
    .gallery {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }

    body {
        padding: 30px 4%;
    }
}

@media (max-width: 450px) {
    .gallery {
        gap: 8px;
    }

    header h1 {
        font-size: 22px;
    }
}
</style>
</head>

<body>

<br>
<header>
 
</header>

<!-- FOTOGALERIE -->

<main class="gallery">

    <img src="Portrait1.jpg" alt="Portrait 1" onclick="openPhoto(this.src)">
    <img src="Portrait2.jpg" alt="Portrait 2" onclick="openPhoto(this.src)">
    <img src="Portrait3.jpg" alt="Portrait 3" onclick="openPhoto(this.src)">
    <img src="Portrait4.jpg" alt="Portrait 4" onclick="openPhoto(this.src)">
    <img src="Portrait5.jpg" alt="Portrait 5" onclick="openPhoto(this.src)">
    <img src="Portrait6.jpg" alt="Portrait 6" onclick="openPhoto(this.src)">
    <img src="Portrait7.jpg" alt="Portrait 7" onclick="openPhoto(this.src)">
    <img src="Portrait8.jpg" alt="Portrait 8" onclick="openPhoto(this.src)">
    <img src="Portrait9.jpg" alt="Portrait 9" onclick="openPhoto(this.src)">


</main>

<!-- KONTAKT -->

<footer>
    Kontakt:
    <a href="mailto:info@4fingersfilme.de">
        info@4fingersfilme.de
    </a>
</footer>

<!-- LIGHTBOX -->

<div class="lightbox" id="lightbox">
    <span class="close" onclick="closePhoto()">&times;</span>
    <img id="largeImage" src="" alt="Portrait Großansicht">
</div>

<!-- JAVASCRIPT -->

<script>
function openPhoto(src) {
    document.getElementById("largeImage").src = src;
    document.getElementById("lightbox").classList.add("active");
}

function closePhoto() {
    document.getElementById("lightbox").classList.remove("active");
}

document.getElementById("lightbox").onclick = function(e) {
    if (e.target === this) {
        closePhoto();
    }
};

document.addEventListener("keydown", function(e) {
    if (e.key === "Escape") {
        closePhoto();
    }
});
</script>

</body>
</html>
