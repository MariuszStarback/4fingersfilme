
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fotos | 4Fingers Filme</title>

    
<style>
:root {
    --bg-color: #D3D3D9;
    --text-color: #ffffff;
    --accent-color: #99f3ff;
    --muted-text: #8e94a5;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: var(--bg-color);
    color: var(--text-color);
    font-family: Arial, sans-serif;
    min-height: 100vh;
    padding: 45px 6%;
}

header {
    text-align: center;
    margin-bottom: 45px;
}

header h1 {
    font-size: 28px;
    font-weight: 400;
    letter-spacing: 5px;
    text-transform: uppercase;
}

header h1 span {
    color: var(--accent-color);
}

.gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    max-width: 1400px;
    margin: auto;
}

.gallery img {
    width: 100%;
    aspect-ratio: 4 / 5;
    object-fit: cover;
    display: block;
    cursor: pointer;
    transition: transform 0.3s ease, opacity 0.3s ease;
}

.gallery img:hover {
    transform: scale(1.02);
    opacity: 0.9;
}

/* Großansicht */

.lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(20, 20, 25, 0.94);
    justify-content: center;
    align-items: center;
    z-index: 100;
    padding: 30px;
}

.lightbox img {
    max-width: 90%;
    max-height: 90vh;
    object-fit: contain;
}

.lightbox.active {
    display: flex;
}

.close {
    position: absolute;
    top: 20px;
    right: 30px;
    font-size: 40px;
    color: var(--accent-color);
    cursor: pointer;
}

@media (max-width: 800px) {
    .gallery {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }

    body {
        padding: 30px 4%;
    }
}

@media (max-width: 450px) {
    .gallery {
        gap: 8px;
    }

    header h1 {
        font-size: 22px;
    }
}
</style>
</head>

<body>

<header>
    <h1>4FINGERS <span>FOTOS</span></h1>
</header>

KONTAKT: info@4fingersfilme.de

    
<main class="gallery">

    <img src="Portrait1.jpg" alt="Portrait 1" onclick="openPhoto(this.src)">
    <img src="Portrait2.jpg" alt="Portrait 2" onclick="openPhoto(this.src)">
    <img src="Portrait3.jpg" alt="Portrait 3" onclick="openPhoto(this.src)">
    <img src="Portrait4.jpg" alt="Portrait 4" onclick="openPhoto(this.src)">
    <img src="Portrait5.jpg" alt="Portrait 5" onclick="openPhoto(this.src)">
    <img src="Portrait6.jpg" alt="Portrait 6" onclick="openPhoto(this.src)">
    <img src="Portrait7.jpg" alt="Portrait 7" onclick="openPhoto(this.src)">
    <img src="Portrait8.jpg" alt="Portrait 8" onclick="openPhoto(this.src)">
    <img src="Portrait9.jpg" alt="Portrait 9" onclick="openPhoto(this.src)">
    <img src="Portrait10.jpg" alt="Portrait 10" onclick="openPhoto(this.src)">
    <img src="Portrait11.jpg" alt="Portrait 11" onclick="openPhoto(this.src)">
    <img src="Portrait12.jpg" alt="Portrait 12" onclick="openPhoto(this.src)">

</main>
<div class="lightbox" id="lightbox">
    <span class="close" onclick="closePhoto()">&times;</span>
    <img id="largeImage" src="" alt="Portrait">
</div>

<script>
const gallery = document.getElementById("gallery");

for (let i = 1; i <= 15; i++) {
    const img = document.createElement("img");
    img.src = `Portrait${i}.jpg`;
    img.alt = `Portrait ${i}`;
    img.loading = "lazy";

    img.onclick = () => openPhoto(img.src);

    gallery.appendChild(img);
}


    
</body>
</html>
